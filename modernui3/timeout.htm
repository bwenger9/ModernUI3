	<style type="text/css">

			--modern-text-primary: #0F172A;

			padding: 0;
			height: 100%;
		}

	<script type="text/javascript">
		(function () {

				return Boolean(val && !/^%%[^%]+%%$/.test(val));

			function readQueryParam(params, targetName) {
				var needle = targetName.toLowerCase();
				var result = "";
				params.forEach(function (value, key) {
					if (!result && key.toLowerCase() === needle) {
						result = value;
					}
				});
				return result;
			}

			function scrubSessionFromAddressBar() {
				if (!navigator.cookieEnabled) {
					return;

				try {
					var currentUrl = new URL(window.location.href);
					var removed = false;

					});
					if (removed) {
						history.replaceState(history.state, "", currentUrl.toString());
					}
				} catch (e) {}
			}

			function resolveReconnectUrl(rawPath, biSession) {
				var fallback = "../modernui3.htm";
				var resolved;
				try {
					resolved = new URL(rawPath || fallback, window.location.href);
					if (resolved.origin !== window.location.origin || (resolved.protocol !== "http:" && resolved.protocol !== "https:")) {
						resolved = new URL(fallback, window.location.href);
					}
				} catch (e) {
					resolved = new URL(fallback, window.location.href);
				}
				Array.from(resolved.searchParams.keys()).forEach(function (k) {
					if (k.toLowerCase() === "session") {
						resolved.searchParams.delete(k);
					}
				});
				if (biSession && !navigator.cookieEnabled) {
					resolved.searchParams.set("session", biSession);
				}
				return resolved.pathname + resolved.search + resolved.hash;
			}

			var sysToken = "%%SYSNAME%%";
			var sessionToken = "%%SESSION%%";
			var sysName = isExpandedToken(sysToken) ? sysToken : "Blue Iris";
			var biSession = isExpandedToken(sessionToken) ? sessionToken : "";

			scrubSessionFromAddressBar();

			var query = new URLSearchParams(window.location.search);
			var badgeEl = document.getElementById("statusBadgeText");
			var headingEl = document.getElementById("timeoutHeading");
			var bodyEl = document.getElementById("timeoutBody");
			var hintEl = document.getElementById("timeoutHint");

			if (readQueryParam(query, "serverSessionLimit") === "1") {
				badgeEl.textContent = "SESSION LIMIT";
				headingEl.textContent = sysName + " \u2014 Session Limit Reached";
				bodyEl.textContent = "Your session reached the time limit configured for this user in Blue Iris Settings > Users.";
				hintEl.style.display = "none";
			} else if (readQueryParam(query, "serverDailyLimit") === "1") {
				badgeEl.textContent = "DAILY LIMIT";
				headingEl.textContent = sysName + " \u2014 Daily Limit Reached";
				bodyEl.textContent = "This user account reached its daily time limit configured in Blue Iris Settings > Users.";
				hintEl.style.display = "none";
			} else {
				badgeEl.textContent = "IDLE TIMEOUT";
				headingEl.textContent = sysName + " \u2014 Session Timed Out";
				bodyEl.textContent = "Disconnected after a period of inactivity to conserve resources.";
				hintEl.style.display = "";
			}

			var targetUrl = resolveReconnectUrl(readQueryParam(query, "path"), biSession);
			var reconnectBtn = document.getElementById("reconnectBtn");
			reconnectBtn.setAttribute("href", targetUrl);

			var navPending = false;
			var leavingPage = false;
			window.addEventListener("beforeunload", function () {
				leavingPage = true;
			});

			reconnectBtn.addEventListener("click", function (ev) {
				if (navPending) {
					ev.preventDefault();
					return;
				}
				navPending = true;
				setTimeout(function () {
					if (!leavingPage) {
						window.location.assign(targetUrl);
					}
				}, 200);
				try {
					if (window.history.length > 1) {
						ev.preventDefault();
						window.history.back();
					}
				} catch (e) {}
			});
		})();
	</script>
</body>
</html>
